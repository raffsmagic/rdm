# Build, test and lint on every push to main and every pull request: on the machine, and as
# WebAssembly on both WASI targets. Two jobs on ubuntu, cached, and a run overtaken by a newer
# push is cancelled, so a run costs minutes and not hours.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  native:
    name: fmt, clippy and tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          # For the test that builds rdm-wasm and hosts it in node.
          targets: wasm32-unknown-unknown
      # Node 24 has JavaScript Promise Integration, which the rdm-wasm host needs.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Every example runs on its stand-ins and is set beside its transcript: no key, no network.
      - run: cargo test --workspace
      # The core alone, with no helper and no C.
      - run: cargo build -p rdm --no-default-features

  wasm:
    name: WebAssembly
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-wasip1, wasm32-wasip2, wasm32-unknown-unknown
      # What runs a test built for WASI (.cargo/config.toml).
      - uses: bytecodealliance/actions/wasmtime/setup@v1
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --target wasm32-wasip1 -- -D warnings
      - run: cargo clippy --workspace --all-targets --target wasm32-wasip2 -- -D warnings
      # The suite and the doc examples, each in a module, run by wasmtime.
      - run: cargo test --workspace --target wasm32-wasip1
      - run: cargo build -p rdm-wasm --target wasm32-unknown-unknown --release
